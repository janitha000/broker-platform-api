services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Origination_Dev1"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sqlservr"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  api:
    image: origination-api:local
    depends_on:
      sql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__Origination: "Server=sql,1433;Database=Origination;User Id=sa;Password=Origination_Dev1;TrustServerCertificate=True;Encrypt=True"
